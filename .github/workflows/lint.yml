name: Linting and Tests

on: [push]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js v16
      uses: actions/setup-node@v4
      with:
        node-version: 16
    - name: Setup PHP 7.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer
    - uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    - name: Install npm
      run: |
        npm i
    - name: Install composer
      run: |
        composer install
    - name: Run lint
      run: |
        npm run lint
    - name: Run tests
      run: |
        ./vendor/bin/phpunit
